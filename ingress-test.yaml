apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: simple-nginx-ingress
  namespace: external-developer-ns
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: nginx.4nm1tsu.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: simple-nginx-svc
            port:
              number: 80
