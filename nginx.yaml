apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-nginx
  namespace: external-developers
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simple-nginx
  template:
    metadata:
      labels:
        app: simple-nginx
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        env:
        - name: APP_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: simple-nginx-secret
              key: api_key
        volumeMounts:
        - name: storage
          mountPath: /usr/share/nginx/html
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: simple-nginx-svc
  namespace: external-developers
spec:
  selector:
    app: simple-nginx
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
